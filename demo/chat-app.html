<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Chat — Compose</title>
<style>
  @font-face{font-family:Geist;src:local("Geist"),local("Inter");}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 Geist,system-ui,sans-serif;background:#0f1115;color:#e8eaed;height:100vh;display:grid;grid-template-rows:48px 1fr auto}
  header{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #2a2f3a;background:#161a22}
  header b{font-weight:650;letter-spacing:-.02em}
  .dot{width:8px;height:8px;border-radius:50%;background:#3dd68c}
  main{padding:24px;overflow:auto}
  .bubble{max-width:720px;background:#1c2230;border:1px solid #2a2f3a;border-radius:14px;padding:14px 16px;margin-bottom:12px;white-space:pre-wrap}
  .bubble img{max-width:100%;border-radius:10px;margin-top:8px;border:1px solid #2a2f3a}
  footer{padding:14px 16px 18px;border-top:1px solid #2a2f3a;background:#161a22}
  .composer{display:flex;gap:10px;align-items:flex-end;max-width:900px}
  textarea{flex:1;min-height:88px;resize:vertical;border-radius:12px;border:1px solid #3a4150;background:#0f1115;color:#e8eaed;padding:12px 14px;font:inherit}
  textarea:focus{outline:2px solid #4c8dff;outline-offset:1px}
  button{height:40px;padding:0 16px;border:0;border-radius:999px;background:#e8eaed;color:#0f1115;font:600 14px Geist,system-ui;cursor:pointer}
</style>
</head>
<body>
<header><span class="dot"></span><b>Chat</b><span style="color:#8b93a7;font-size:13px">composer · paste Pointcast here</span></header>
<main id="feed">
  <div class="bubble" style="color:#8b93a7">Ask anything about the UI. Paste a Pointcast prompt below.</div>
</main>
<footer>
  <div class="composer">
    <textarea id="box" placeholder="Message…" autofocus></textarea>
    <button type="button" onclick="send()">Send</button>
  </div>
</footer>
<script>
function send(){
  const t=document.getElementById('box');
  if(!t.value.trim())return;
  const d=document.createElement('div');
  d.className='bubble';
  d.textContent=t.value;
  document.getElementById('feed').appendChild(d);
  t.value='';
}
document.getElementById('box').addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();send();}
});
</script>
</body>
</html>
