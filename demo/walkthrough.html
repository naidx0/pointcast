<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pointcast demo — assembled prompt</title>
    <style>
      body { margin: 0; background: #0e0d0b; color: #f4efe6; font-family: "IBM Plex Sans", ui-sans-serif, sans-serif; }
      header { padding: 20px 28px; border-bottom: 1px solid #2a261e; }
      h1 { font-family: Georgia, serif; font-weight: 500; margin: 4px 0 0; }
      .kicker { color: #f5a524; letter-spacing: .2em; text-transform: uppercase; font-size: 11px; }
      article { max-width: 820px; margin: 24px auto; padding: 24px; background: #161410; border-radius: 16px; line-height: 1.6; }
      img { max-width: 100%; border-radius: 8px; border: 1px solid #2a261e; margin: 12px 0; }
      .marker { font-family: ui-monospace, monospace; color: #8fd3e8; font-size: 12px; }
      .pill { display: inline-block; background: #f5a524; color: #0e0d0b; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <div class="kicker">Pointcast · last prompt</div>
      <h1>Ready to paste into any AI tool</h1>
    </header>
    <article>
      <p>The Place order button is sitting on top of the total. I boxed it and dropped a pin.</p>
      <p>
        <span class="pill">1</span>
        <span class="marker">[image 1: 1=Place order — 28px too far left]</span>
      </p>
      <img id="shot" alt="annotated region of the Place order button" />
      <p>Please shift the primary button so it no longer overlaps the total.</p>
    </article>
    <script>
      const q = new URLSearchParams(location.search);
      const src = q.get("img") || "freeze.png";
      document.getElementById("shot").src = src;
    </script>
  </body>
</html>
