name: Install test

# Runs the one-line installs exactly as the README gives them, on fresh macOS and Windows machines, then checks that
# Pointcast is installed and running and keeps a screenshot of the screen. Run by hand with "draft" to try the
# installers of the draft release (same scripts, given the downloaded file) before anything is published.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Install the published release, or the draft one"
        type: choice
        options: [published, draft]
        default: published
  release:
    types: [published]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: inputs.source == 'draft'
      - name: Install the draft release's dmg with the install script
        if: inputs.source == 'draft'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release download "v$VERSION" -p Pointcast-macOS.dmg -D "$RUNNER_TEMP"
          POINTCAST_DMG="$RUNNER_TEMP/Pointcast-macOS.dmg" bash install.sh
      - name: Install with the one-line command
        if: inputs.source != 'draft'
        run: curl -fsSL https://raw.githubusercontent.com/naidx0/pointcast/main/install.sh | bash
      - name: Pointcast is installed and running
        run: |
          test -d /Applications/Pointcast.app || test -d "$HOME/Applications/Pointcast.app"
          for i in $(seq 1 30); do pgrep -x pointcast && break; sleep 1; done
          pgrep -x pointcast
          sleep 8
          pgrep -x pointcast
      - name: Screenshots over 20 seconds
        if: always()
        run: |
          for i in 1 2 3; do screencapture -x "macos-$i.png" || true; sleep 10; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: install-test-macos
          path: macos-*.png
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: inputs.source == 'draft'
      - name: Install the draft release's installer with the install script
        if: inputs.source == 'draft'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          gh release download "v$version" -p Pointcast-Windows-setup.exe -D $env:RUNNER_TEMP
          $env:POINTCAST_SETUP = Join-Path $env:RUNNER_TEMP 'Pointcast-Windows-setup.exe'
          & ./install.ps1
      - name: Install with the one-line command
        if: inputs.source != 'draft'
        shell: powershell
        run: irm https://raw.githubusercontent.com/naidx0/pointcast/main/install.ps1 | iex
      - name: Pointcast is installed and running
        shell: powershell
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Pointcast\pointcast.exe'
          if (-not (Test-Path $exe)) { throw "pointcast.exe is not installed" }
          $p = $null
          foreach ($i in 1..30) { $p = Get-Process pointcast -ErrorAction SilentlyContinue; if ($p) { break }; Start-Sleep 1 }
          if (-not $p) { throw "Pointcast is not running" }
          Start-Sleep 8
          if (-not (Get-Process pointcast -ErrorAction SilentlyContinue)) { throw "Pointcast stopped" }
      - name: Screenshot
        if: always()
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("windows.png")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: install-test-windows
          path: windows.png
          if-no-files-found: ignore
