name: Release

# Push a tag like v0.4.0 (or run this by hand) to build the installers the one-line scripts
# download. The release is created as a draft: publish it on GitHub to make it the latest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which installers to build"
        type: choice
        options: [all, macos, windows]
        default: all

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'macos' && '[{"os":"macos-latest","platform":"macos","args":"--target universal-apple-darwin --bundles app,dmg"}]' || inputs.platforms == 'windows' && '[{"os":"windows-latest","platform":"windows","args":"--bundles nsis"}]' || '[{"os":"macos-latest","platform":"macos","args":"--target universal-apple-darwin --bundles app,dmg"},{"os":"windows-latest","platform":"windows","args":"--bundles nsis"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0 (action-v0.6.2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Pointcast ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            **macOS** (Terminal): `curl -fsSL https://raw.githubusercontent.com/naidx0/pointcast/main/install.sh | bash`
            **Windows** (PowerShell): `irm https://raw.githubusercontent.com/naidx0/pointcast/main/install.ps1 | iex`
            Or download the file for your system below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      # The same installer under a name that never changes, so the page's Download buttons always point at the newest.
      - name: Upload the installer under its fixed name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${{ matrix.platform }}" = macos ]; then
            SRC=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1); NAME=Pointcast-macOS.dmg
          else
            SRC=$(ls src-tauri/target/release/bundle/nsis/*x64-setup.exe | head -1); NAME=Pointcast-Windows-setup.exe
          fi
          cp "$SRC" "$NAME"
          gh release upload "v$VERSION" "$NAME" --clobber
