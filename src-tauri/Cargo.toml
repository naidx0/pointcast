[package]
name = "pointcast"
version = "0.4.0"
description = "Voice plus annotated screenshots into one prompt for any AI tool"
authors = ["Pointcast contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "pointcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pointcast"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = { version = "0.9", default-features = false }
cpal = "0.15"
libloading = "0.8"
sha2 = "0.10"
base64 = "0.22"
arboard = { version = "3.4", features = ["wayland-data-control"] }
enigo = "0.2.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tar = "0.4"
bzip2 = "0.4"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mouse_position = "0.1.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Storage_FileSystem"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
